<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LawCite TT — Laws of Trinidad and Tobago</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --border: #dee2e6;
    --text: #212529;
    --muted: #6c757d;
    --accent: #1a3a5c;
    --accent-light: #2b5f8a;
    --highlight: #fff3cd;
    --radius: 8px;
  }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 0 16px; }

  /* header */
  header {
    background: var(--accent);
    color: #fff;
    padding: 24px 0;
    border-bottom: 4px solid var(--accent-light);
  }
  header h1 { font-size: 1.5rem; font-weight: 700; }
  header p { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; }

  /* stats bar */
  .stats-bar {
    display: flex; gap: 24px; padding: 12px 0;
    font-size: 0.8rem; color: var(--muted);
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .stats-bar span { white-space: nowrap; }
  .stats-bar strong { color: var(--text); }

  /* search */
  .search-section { margin-bottom: 24px; }
  .search-row {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .search-row input[type="text"] {
    flex: 1; min-width: 200px;
    padding: 12px 16px; font-size: 1rem;
    border: 2px solid var(--border); border-radius: var(--radius);
    outline: none; transition: border-color .15s;
  }
  .search-row input[type="text"]:focus { border-color: var(--accent-light); }
  .search-row select {
    padding: 12px; font-size: 0.9rem;
    border: 2px solid var(--border); border-radius: var(--radius);
    background: var(--surface); cursor: pointer;
  }
  .search-row button {
    padding: 12px 24px; font-size: 0.95rem; font-weight: 600;
    background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius);
    cursor: pointer; transition: background .15s;
  }
  .search-row button:hover { background: var(--accent-light); }

  /* filters row */
  .filters-row {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;
  }
  .filters-row select, .filters-row input {
    padding: 8px 12px; font-size: 0.85rem;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface);
  }
  .filters-row input { flex: 1; min-width: 150px; }

  /* results */
  .results { margin-top: 16px; }
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    transition: box-shadow .15s;
  }
  .result-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .result-meta {
    display: flex; gap: 12px; flex-wrap: wrap;
    font-size: 0.8rem; color: var(--muted);
    margin-bottom: 8px;
  }
  .result-meta .chapter { font-weight: 600; color: var(--accent); }
  .result-meta .section { font-weight: 600; }
  .result-text {
    font-size: 0.9rem; line-height: 1.65;
    max-height: 120px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  .result-text em { background: var(--highlight); font-style: normal; padding: 0 2px; }
  .result-score { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }

  /* lookup section */
  .lookup-section {
    margin-top: 32px; padding-top: 24px;
    border-top: 2px solid var(--border);
  }
  .lookup-section h2 { font-size: 1.1rem; margin-bottom: 12px; }
  .lookup-row {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .lookup-row input {
    padding: 8px 12px; font-size: 0.9rem;
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  .lookup-row button {
    padding: 8px 16px; font-size: 0.85rem; font-weight: 600;
    background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius); cursor: pointer;
  }
  .version-timeline { margin-top: 12px; }
  .version-entry {
    padding: 10px 12px; margin-bottom: 6px;
    border-left: 3px solid var(--accent-light);
    background: var(--surface);
    font-size: 0.85rem;
  }
  .version-entry .date { font-weight: 600; color: var(--accent); }

  .source-link {
    font-size: 0.78rem; margin-top: 6px;
  }
  .source-link a {
    color: var(--accent-light); text-decoration: none;
  }
  .source-link a:hover { text-decoration: underline; }

  /* no results */
  .no-results { text-align: center; padding: 48px 16px; color: var(--muted); }

  /* tabs */
  .tab-bar { display: flex; gap: 0; margin-bottom: 16px; }
  .tab-btn {
    padding: 10px 20px; font-size: 0.85rem; font-weight: 600;
    border: 1px solid var(--border); background: var(--bg);
    cursor: pointer; transition: all .15s;
  }
  .tab-btn:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .tab-btn:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* loading */
  .spinner {
    text-align: center; padding: 32px; color: var(--muted);
  }
  .spinner::after {
    content: ""; display: inline-block; width: 24px; height: 24px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* responsive */
  @media (max-width: 640px) {
    .search-row { flex-direction: column; }
    .search-row input[type="text"] { min-width: auto; }
    .stats-bar { flex-wrap: wrap; gap: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="container">
    <h1>LawCite TT</h1>
    <p>Temporal legal engine for the Laws of Trinidad and Tobago</p>
  </div>
</header>

<div class="container">
  <div class="stats-bar" id="stats-bar">
    <span>Chapters: <strong id="stat-ch">—</strong></span>
    <span>Versions: <strong id="stat-ve">—</strong></span>
    <span>Chunks: <strong id="stat-cn">—</strong></span>
    <span>Embedded: <strong id="stat-em">—</strong></span>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="search">Search</button>
    <button class="tab-btn" data-tab="lookup">Section Lookup</button>
    <button class="tab-btn" data-tab="browse">Browse Chapters</button>
  </div>

  <!-- Search tab -->
  <div class="tab-content active" id="tab-search">
    <div class="search-section">
      <div class="search-row">
        <input type="text" id="search-q" placeholder="Search laws… e.g. murder, tax exemption, absconding debtor" autofocus/>
        <select id="search-mode">
          <option value="fts">Full-Text Search (fast)</option>
          <option value="hybrid">Hybrid (FTS + Vector)</option>
          <option value="vector">Vector (Semantic)</option>
        </select>
        <button onclick="doSearch()">Search</button>
      </div>
      <div class="filters-row">
        <input type="text" id="search-chapter" placeholder="Chapter (optional, e.g. 8:08, 48:50)" list="chapter-list"/>
        <datalist id="chapter-list"></datalist>
      </div>
    </div>
    <div id="search-results"></div>
  </div>

  <!-- Lookup tab -->
  <div class="tab-content" id="tab-lookup">
    <div class="lookup-section">
      <div class="lookup-row">
        <input type="text" id="lookup-chapter" placeholder="Chapter (e.g. 8:08)" list="chapter-list2"/>
        <datalist id="chapter-list2"></datalist>
        <input type="text" id="lookup-section" placeholder="Section (e.g. 1, 3A, 24(1))"/>
        <input type="text" id="lookup-date" placeholder="As at date (e.g. 2016-12-31)" title="Leave empty for all versions"/>
        <button onclick="doLookup()">Look up</button>
      </div>
    </div>
    <div class="version-timeline" id="lookup-results"></div>
  </div>

  <!-- Browse tab -->
  <div class="tab-content" id="tab-browse">
    <div class="search-row" style="margin-bottom:12px">
      <input type="text" id="browse-q" placeholder="Filter chapters… e.g. tax, criminal, education"/>
    </div>
    <div id="browse-results"></div>
  </div>
</div>

<script>
// --- Tab switching ---
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
  });
});

// --- Load stats ---
fetch("/api/stats").then(r => r.json()).then(d => {
  document.getElementById("stat-ch").textContent = d.chapters;
  document.getElementById("stat-ve").textContent = d.versions;
  document.getElementById("stat-cn").textContent = d.chunks.toLocaleString();
  document.getElementById("stat-em").textContent = d.embedded.toLocaleString();
});

// --- Search ---
function doSearch() {
  const q = document.getElementById("search-q").value.trim();
  if (!q) return;
  const mode = document.getElementById("search-mode").value;
  const chapter = document.getElementById("search-chapter").value.trim();
  const resultsEl = document.getElementById("search-results");
  resultsEl.innerHTML = '<div class="spinner"></div>';

  let url = `/api/search?q=${encodeURIComponent(q)}&mode=${encodeURIComponent(mode)}&limit=20`;
  if (chapter) url += `&chapter=${encodeURIComponent(chapter)}`;

  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (!data.length) {
        resultsEl.innerHTML = '<div class="no-results">No matching provisions found.</div>';
        return;
      }
      resultsEl.innerHTML = `<p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">${data.length} result${data.length > 1 ? 's' : ''}</p>`
        + data.map(r => renderResult(r, q)).join("");
    })
    .catch(err => {
      resultsEl.innerHTML = `<div class="no-results">Error: ${err.message}</div>`;
    });
}

function renderResult(r, q) {
  const ch = r.chapter_number || "";
  const sec = r.section_ref || "";
  const date = r.as_at_date || "";
  const score = r.score != null ? `score: ${r.score.toFixed(4)}` : "";
  const pdf = r.pdf_url || "";
  let text = r.chunk_text || "";
  if (q) {
    const words = q.split(/\s+/).filter(w => w.length > 2);
    words.forEach(w => {
      const re = new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, "gi");
      text = text.replace(re, "<em>$1</em>");
    });
  }
  const link = pdf ? `<div class="source-link">📄 <a href="${escHtml(pdf)}" target="_blank" rel="noopener">View Official PDF Document</a></div>` : "";

  return `<div class="result-card">
    <div class="result-meta">
      <span class="chapter">${escHtml(ch)}</span>
      <span class="section">s${escHtml(sec)}</span>
      ${date ? `<span>${escHtml(date)}</span>` : ""}
      ${score ? `<span>${score}</span>` : ""}
    </div>
    <div class="result-text">${text}</div>
    ${link}
  </div>`;
}

// --- Lookup ---
function doLookup() {
  const chapter = document.getElementById("lookup-chapter").value.trim();
  const section = document.getElementById("lookup-section").value.trim();
  const date = document.getElementById("lookup-date").value.trim();
  if (!chapter || !section) return;
  const el = document.getElementById("lookup-results");
  el.innerHTML = '<div class="spinner"></div>';

  let url = `/api/lookup?chapter=${encodeURIComponent(chapter)}&section=${encodeURIComponent(section)}`;
  if (date) url += `&date=${encodeURIComponent(date)}`;

  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (!data.length) {
        el.innerHTML = '<div class="no-results">No versions found for this provision.</div>';
        return;
      }
      el.innerHTML = `<p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">${data.length} version${data.length > 1 ? 's' : ''}</p>`
        + data.map(r => `<div class="version-entry">
          <div class="date">${r.as_at_date || "No date"} ${r.version_label ? "— " + escHtml(r.version_label) : ""}</div>
          <div class="result-text">${escHtml(r.chunk_text)}</div>
          ${r.pdf_url ? `<div class="source-link">📄 <a href="${escHtml(r.pdf_url)}" target="_blank" rel="noopener">View Official PDF Document</a></div>` : ""}

        </div>`).join("");
    })
    .catch(err => {
      el.innerHTML = `<div class="no-results">Error: ${err.message}</div>`;
    });
}

// --- Browse ---
let allChapters = [];

function loadChapters() {
  fetch("/api/chapters?limit=533")
    .then(r => r.json())
    .then(data => {
      allChapters = data;
      renderChapters(data);
      // populate datalists
      const opts = data.map(c => `<option value="${escHtml(c.chapter)}">`).join("");
      document.getElementById("chapter-list").innerHTML = opts;
      document.getElementById("chapter-list2").innerHTML = opts;
    });
}

function filterChapters() {
  const q = document.getElementById("browse-q").value.toLowerCase();
  const filtered = allChapters.filter(c =>
    c.chapter.toLowerCase().includes(q) || c.title.toLowerCase().includes(q)
  );
  renderChapters(filtered);
}

function renderChapters(data) {
  const el = document.getElementById("browse-results");
  el.innerHTML = data.map(c =>
    `<div class="result-card" style="cursor:pointer" onclick="quickSearch('${escHtml(c.chapter)}')">
      <div class="result-meta"><span class="chapter">${escHtml(c.chapter)}</span></div>
      <div class="result-text" style="max-height:none">${escHtml(c.title)}</div>
    </div>`
  ).join("");
  if (!data.length) el.innerHTML = '<div class="no-results">No chapters match that filter.</div>';
}

function quickSearch(chapter) {
  document.getElementById("search-chapter").value = chapter;
  document.querySelector('[data-tab="search"]').click();
  document.getElementById("search-q").focus();
}

document.getElementById("browse-q").addEventListener("input", filterChapters);

// --- utils ---
function escHtml(s) {
  if (!s) return "";
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// enter-to-search
document.getElementById("search-q").addEventListener("keydown", e => {
  if (e.key === "Enter") doSearch();
});
document.getElementById("lookup-section").addEventListener("keydown", e => {
  if (e.key === "Enter") doLookup();
});

// init
loadChapters();
</script>
</body>
</html>
